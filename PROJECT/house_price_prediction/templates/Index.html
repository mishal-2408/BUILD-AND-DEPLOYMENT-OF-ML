<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Price Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container" style="max-width:520px; margin-top:40px">
  <div class="card-form">
    <h2 class="brand">House Price Predictor</h2>
    <h5>Welcome, {{ username }}!</h5>
    <form action="{{ url_for('dashboard') }}" method="post" class="mt-3">
      <input type="number" min="100" name="Area" value="{{ request.form.get('Area', '') }}"
             placeholder="Area (sq ft)" class="form-control mb-3" required>
      <select name="Bedrooms" class="form-select mb-3" required>
        <option value="">Bedrooms</option>
        {% for n in range(1, 7) %}
        <option value="{{ n }}" {{ 'selected' if request.form.get('Bedrooms') == n|string }}>{{ n }}</option>
        {% endfor %}
      </select>
      <select name="Bathrooms" class="form-select mb-3" required>
        <option value="">Bathrooms</option>
        {% for n in range(1, 6) %}
        <option value="{{ n }}" {{ 'selected' if request.form.get('Bathrooms') == n|string }}>{{ n }}</option>
        {% endfor %}
      </select>
      <input type="number" min="0" name="Age" value="{{ request.form.get('Age', '') }}"
             placeholder="Age of the house (years)" class="form-control mb-3" required>
      <input type="number" step="0.1" min="0" name="Distance_City" value="{{ request.form.get('Distance_City', '') }}"
             placeholder="Distance from city centre (km)" class="form-control mb-3" required>
      <select name="Garage" class="form-select mb-3" required>
        <option value="">Garage / Parking</option>
        <option value="1" {{ 'selected' if request.form.get('Garage') == '1' }}>Yes</option>
        <option value="0" {{ 'selected' if request.form.get('Garage') == '0' }}>No</option>
      </select>
      <button type="submit" class="btn btn-power w-100">Predict</button>
    </form>
    {% if prediction_text %}
      <div class="result-box">{{ prediction_text }}</div>
    {% endif %}
    <a href="{{ url_for('logout') }}" class="d-block text-center mt-3">Logout</a>
  </div>
</div>
<div class="footer-dark">House Price Predictor &copy; 2025</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
